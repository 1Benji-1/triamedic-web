{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Clínica Cristiana "El Buen Samaritano"</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <img src="{% static 'images/logo.png' %}" alt="Logo Clínica El Buen Samaritano">
                </div>
                <h1 class="login-title">El Buen Samaritano</h1>
                <p class="login-subtitle">Sistema de Historias Clínicas · Consulta Externa</p>
            </div>

            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" style="position: relative; animation: none; min-width: auto;">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_username">
                        <i data-feather="user" style="width: 15px; height: 15px; display: inline; vertical-align: middle; color: var(--color-primary);"></i>
                        Usuario
                    </label>
                    <input type="text" name="username" id="id_username" class="form-input"
                        placeholder="Ingrese su nombre de usuario" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_password">
                        <i data-feather="lock" style="width: 15px; height: 15px; display: inline; vertical-align: middle; color: var(--color-primary);"></i>
                        Contraseña
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" name="password" id="id_password" class="form-input"
                            placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                        <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Mostrar u ocultar contraseña">
                            <i data-feather="eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary login-btn">
                    <i data-feather="log-in"></i>
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-security-badge">
                <i data-feather="shield" style="width: 14px; height: 14px; color: var(--color-success);"></i>
                <span>Acceso Seguro Restringido · Personal Autorizado</span>
            </div>
        </div>
    </div>

    <script>
        feather.replace();

        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('id_password');
        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', function() {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.innerHTML = isPass ? '<i data-feather="eye-off"></i>' : '<i data-feather="eye"></i>';
                feather.replace();
            });
        }
    </script>
</body>

</html>
